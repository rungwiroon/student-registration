services:
  api:
    image: csr-api:latest
    pull_policy: never
    build:
      context: ./CsrApi
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:?CONNECTION_STRING is required}
      - EncryptionKey=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - Line__LiffChannelId=${LINE_LIFF_CHANNEL_ID:?LINE_LIFF_CHANNEL_ID is required}
      - Bootstrap__SecretToken=${BOOTSTRAP_SECRET_TOKEN:-}
      - GoogleSheets__CredentialsPath=/app/credentials/service-account.json
      - GoogleSheets__SpreadsheetId=${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      - PublicBaseUrl=${PUBLIC_BASE_URL:-}
      - SlipStorage__RootPath=${SHIRT_ORDER_SLIP_PATH:-/app/data/ShirtOrderSlips}
    volumes:
      - app_data:/app/data
      - ./CsrApi/App_Data/GoogleCredentials:/app/credentials:ro

  frontend:
    image: csr-frontend:latest
    pull_policy: never
    build:
      context: ./csr-frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  app_data:

networks:
  default:
    name: proxy
    external: true